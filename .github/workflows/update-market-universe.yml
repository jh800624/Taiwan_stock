name: Update market universe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-universe.yml'
      - 'scripts/fetch_market_universe.py'
  schedule:
    # 21:30 UTC = Taiwan time 05:30; official daily snapshots are then settled.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official market snapshots
        run: python3 scripts/fetch_market_universe.py
      - name: Publish changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/market-universe.json)" ]; then
            echo "No market-data change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-universe.json
          git commit -m "chore: update market universe"
          git push
